<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap">
<style>
:root{--bg:#eef0fb;--card:#fff;--ink:#1b1f3b;--mute:#666c91;--b1:#e8ebf8;--b2:#dde1f4;--a:#5b5bd6;--head:#0fae7c;--tail:#6366f1;--food:#f43f5e;--ov:rgba(238,240,251,.84);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1b1e3a;--ink:#eceefe;--mute:#9aa0c8;--b1:#1f2342;--b2:#252a4e;--a:#8b8cff;--head:#34d399;--tail:#818cf8;--food:#fb7185;--ov:rgba(18,20,42,.82);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1b1e3a;--ink:#eceefe;--mute:#9aa0c8;--b1:#1f2342;--b2:#252a4e;--a:#8b8cff;--head:#34d399;--tail:#818cf8;--food:#fb7185;--ov:rgba(18,20,42,.82);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.stats{display:flex;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:8px 16px;min-width:84px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--mute)}
.board{position:relative;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 10px 30px rgba(60,60,140,.14)}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:14px;touch-action:none}
.ov{position:absolute;inset:10px;border-radius:14px;background:var(--ov);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;cursor:pointer}
.ov.hide{display:none}
.ov h2{margin:0;font-size:2rem}
.ov p{margin:0;color:var(--mute);max-width:30ch;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:2px}
button{font:inherit;color:var(--ink);border:0;background:transparent;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--a);color:#fff}
.solo{background:var(--card)}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center}
.pad button{background:var(--card);font-size:1.4rem;border-radius:16px}
.pad [data-d="U"]{grid-column:2}.pad [data-d="L"]{grid-column:1;grid-row:2}.pad [data-d="D"]{grid-column:2;grid-row:2}.pad [data-d="R"]{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}}
.hint{margin:0;text-align:center;color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Snake</h1>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>Score</span></div>
      <div class="stat"><b id="best">0</b><span>Best</span></div>
    </div>
  </header>
  <div class="board">
    <canvas id="cv" width="600" height="600" aria-label="Snake game board"></canvas>
    <div class="ov" id="ov" role="button" tabindex="0"><h2 id="ovt">Ready?</h2><p id="ovp">Press an arrow key or Space, or tap here to start.</p></div>
  </div>
  <div class="bar">
    <div class="seg" id="speed" role="group" aria-label="Speed">
      <button data-s="170" aria-pressed="false">Easy</button>
      <button data-s="125" aria-pressed="true">Medium</button>
      <button data-s="85" aria-pressed="false">Fast</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Edges">
      <button data-m="wall" aria-pressed="true">Walls</button>
      <button data-m="wrap" aria-pressed="false">Wrap</button>
    </div>
    <button class="solo" id="pause">Pause</button>
  </div>
  <div class="pad" id="pad"><button data-d="U" aria-label="Up">▲</button><button data-d="L" aria-label="Left">◀</button><button data-d="D" aria-label="Down">▼</button><button data-d="R" aria-label="Right">▶</button></div>
  <p class="hint">Steer with arrow keys or WASD. Space pauses. Walls ends the game on contact; Wrap lets you pass through.</p>
</main>
<script>
const N=20,CS=30,cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const DIRS={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
let snake,dir,queue,food,score,best=0,state="idle",ms=125,wrap=false,timer=null;
try{best=+localStorage.getItem("snake-best")||0}catch(e){}
$("best").textContent=best;

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function reset(){snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir=DIRS.R;queue=[];score=0;$("score").textContent=0;placeFood();state="idle";stop();draw();overlay("Ready?","Press an arrow key or Space, or tap here to start.")}
function placeFood(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
function overlay(t,p){$("ovt").textContent=t;$("ovp").textContent=p;$("ov").classList.remove("hide")}
function stop(){clearInterval(timer);timer=null}
function run(){stop();timer=setInterval(step,ms)}
function start(){state="play";$("ov").classList.add("hide");$("pause").textContent="Pause";run()}
function togglePause(){
  if(state==="play"){state="pause";stop();$("pause").textContent="Resume";overlay("Paused","Press Space or tap here to continue.")}
  else if(state==="pause"){start()}
}
function die(){
  state="over";stop();draw();
  let msg="You scored "+score+". Press Space to play again.";
  if(score>best){best=score;$("best").textContent=best;msg="New best: "+score+"! Press Space to play again.";try{localStorage.setItem("snake-best",best)}catch(e){}}
  overlay("Game over",msg);
}
function step(){
  if(queue.length)dir=queue.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
  else if(h.x<0||h.y<0||h.x>=N||h.y>=N)return die();
  const ate=h.x===food.x&&h.y===food.y;
  const body=ate?snake:snake.slice(0,-1);
  if(body.some(s=>s.x===h.x&&s.y===h.y))return die();
  snake.unshift(h);
  if(ate){score++;$("score").textContent=score;placeFood()}else snake.pop();
  draw();
}
function turn(k){
  const d=DIRS[k],last=queue.length?queue[queue.length-1]:dir;
  if(state==="over")return;
  if(d.x+last.x===0&&d.y+last.y===0)return;
  if(d.x===last.x&&d.y===last.y){if(state==="idle")start();return}
  if(queue.length<2)queue.push(d);
  if(state==="idle"||state==="pause")start();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){
  const b1=css("--b1"),b2=css("--b2"),head=css("--head"),tail=css("--tail"),fc=css("--food");
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2?b1:b2;ctx.fillRect(x*CS,y*CS,CS,CS)}
  ctx.save();ctx.shadowColor=fc;ctx.shadowBlur=18;ctx.fillStyle=fc;
  ctx.beginPath();ctx.arc(food.x*CS+CS/2,food.y*CS+CS/2,CS*.32,0,7);ctx.fill();ctx.restore();
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i];ctx.globalAlpha=i===0?1:Math.max(.5,1-.5*i/snake.length);
    ctx.fillStyle=i===0?head:tail;rr(s.x*CS+2,s.y*CS+2,CS-4,CS-4,i===0?11:9);
  }
  ctx.globalAlpha=1;
  const s=snake[0],cx=s.x*CS+CS/2,cy=s.y*CS+CS/2,px=-dir.y,py=dir.x;
  for(const side of[-1,1]){
    const ex=cx+dir.x*5+px*side*6,ey=cy+dir.y*5+py*side*6;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,3.6,0,7);ctx.fill();
    ctx.fillStyle="#12142a";ctx.beginPath();ctx.arc(ex+dir.x*1.2,ey+dir.y*1.2,1.8,0,7);ctx.fill();
  }
}
addEventListener("keydown",e=>{
  const m={ArrowUp:"U",w:"U",W:"U",ArrowDown:"D",s:"D",S:"D",ArrowLeft:"L",a:"L",A:"L",ArrowRight:"R",d:"R",D:"R"};
  if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault();
  if(e.key===" "){if(state==="over")reset(),start();else if(state==="idle")start();else togglePause();return}
  if(m[e.key])turn(m[e.key]);
});
$("ov").onclick=()=>{if(state==="over"){reset();start()}else if(state==="idle")start();else togglePause()};
$("ov").onkeydown=e=>{if(e.key==="Enter")$("ov").click()};
$("pause").onclick=()=>{if(state==="over")return;if(state==="idle")start();else togglePause()};
document.querySelectorAll("#pad button").forEach(b=>b.onclick=()=>turn(b.dataset.d));
let t0;
cv.addEventListener("touchstart",e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener("touchend",e=>{
  if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"));
});
function group(id,fn){
  const g=$(id);g.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b);
  });
}
group("speed",b=>{ms=+b.dataset.s;if(state==="play")run()});
group("mode",b=>{wrap=b.dataset.m==="wrap";reset()});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
reset();
</script>
</body>
</html>
